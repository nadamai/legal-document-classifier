name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run prettier check
        run: npm run prettier:check

      - name: Run types check
        run: npm run typecheck

      - name: Verify build compiles
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium's headless shell
        run: npx playwright install --only-shell chromium

      - name: Run tests
        run: npm test -- --reporter=verbose
