name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run prettier check
        run: npm run prettier:check

      - name: Run types check
        run: npm run typecheck

      - name: Verify build compiles
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium's headless shell
        run: npx playwright install --only-shell chromium

      - name: Run tests
        run: npm test -- --reporter=verbose

  training-tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r training/requirements.txt

      - name: Install Playwright's Chromium for Python
        run: python -m playwright install --with-deps chromium

      - name: Build the extractor
        run: npm run build

      - name: Run training tests
        run: python -m pytest training -v
